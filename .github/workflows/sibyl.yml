name: sibyl

on:
  pull_request:
    paths:
      - 'plugins/sibyl/**'
      - '.github/workflows/sibyl.yml'
  push:
    branches: [develop, main]
    paths:
      - 'plugins/sibyl/**'

# NOTE: the vitest unit suite (test:unit) is not run here — it has a pre-existing
# jsdom/localStorage env failure in tests/trexAuth.spec.ts tracked separately.
# type-check + build cover the shell's compilation; e2e (playwright) is separate.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: plugins/sibyl
        run: npm install
      - name: Type-check
        working-directory: plugins/sibyl
        run: npm run type-check
      - name: Build
        working-directory: plugins/sibyl
        run: npm run build
      - name: Verify dist
        run: test -f plugins/sibyl/dist/index.html
