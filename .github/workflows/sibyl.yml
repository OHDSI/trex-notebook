name: sibyl

on:
  pull_request:
    paths:
      - 'plugins/sibyl/**'
      - '.github/workflows/sibyl.yml'
  push:
    branches: [develop, main]
    paths:
      - 'plugins/sibyl/**'

# The vitest unit suite (test:unit) now runs here — the prior jsdom/localStorage
# env failure is fixed by a setup shim (tests/setup.ts). e2e (playwright) is separate.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ohdsi'
      - name: Install
        working-directory: plugins/sibyl
        run: npm install
        env:
          # @ohdsi/atlas-ui is served from GitHub Packages, which requires auth
          # even for reads; without a token npm install 401s.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Type-check
        working-directory: plugins/sibyl
        run: npm run type-check
      - name: Unit test
        working-directory: plugins/sibyl
        run: npm run test:unit
      - name: Build
        working-directory: plugins/sibyl
        run: npm run build
      - name: Verify dist
        run: test -f plugins/sibyl/dist/index.html
