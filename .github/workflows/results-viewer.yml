name: results-viewer

on:
  pull_request:
    paths:
      - 'plugins/results-viewer/**'
      - '.github/workflows/results-viewer.yml'
  push:
    branches: [develop, main]
    paths:
      - 'plugins/results-viewer/**'

# NOTE: only the JS bundle is built here. The in-browser R runtime assets
# (shinylive-export/ + r-packages/) are generated by the OHDSI R stack in the
# Docker `r-builder` stage (see docker-image.yml / Dockerfile), not in this
# lightweight Node job. `npm run typecheck` is also skipped — it currently has
# pre-existing type errors tracked separately.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: plugins/results-viewer
        run: npm install
      - name: Build (JS bundle only)
        working-directory: plugins/results-viewer
        run: npm run build
      - name: Verify bundle
        run: test -f plugins/sibyl/public/plugins/results-viewer/index.system.js
