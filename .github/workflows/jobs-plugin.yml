name: jobs-plugin

on:
  pull_request:
    paths:
      - 'plugins/jobs/**'
      - '.github/workflows/jobs-plugin.yml'
  push:
    branches: [develop, main]
    paths:
      - 'plugins/jobs/**'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: plugins/jobs
        run: npm install
      - name: Typecheck
        working-directory: plugins/jobs
        run: npm run typecheck
      - name: Unit test
        working-directory: plugins/jobs
        run: npx vitest run
      - name: Build
        working-directory: plugins/jobs
        run: npm run build
      - name: Verify bundle
        run: test -f plugins/sibyl/public/plugins/jobs-plugin/index.system.js
