name: notebook build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Enter tag for release version
        required: false
        type: string
      artifacttype:
        type: choice
        required: true
        default: "OSS-develop"
        options:
          - "OSS-develop"
          - "OSS-release"
          - "Project"
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - "src/**"
      - "plugins/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "src/**"
      - "plugins/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"

env:
  NPM_ARTIFACT_TYPE: ${{ github.event.inputs.artifacttype || 'OSS-develop' }}

jobs:
  guard-vuetify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check no banned raw Vuetify components
        run: node scripts/check-no-raw-vuetify.mjs

  # NOTE: the old root `build` job (npm ci + typecheck/lint/test + build + publish
  # of the root @trex/notebook package) was removed. This repo is now a plugins
  # monorepo with no root package.json/package-lock.json, so the root `npm ci`
  # could never succeed. Each plugin is built and tested by its own workflow
  # (sibyl.yml, strategus-plugin.yml, network-plugin.yml,
  # results-viewer.yml, notebook-plugin.yml, function-plugins.yml) and the Docker
  # image (docker-image.yml) bakes the finished bundles.
