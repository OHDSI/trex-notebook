# Self-contained stack: the trex backend serving the sibyl shell as a UI plugin
# at /plugins/sibyl, with trex as the identity provider. The trex service is
# built from ./Dockerfile — the published trex image (pinned to an immutable
# sha tag) with the pre-built sibyl `dist` baked into /usr/src/plugins, so the
# running container needs no bind-mounts.
#
#   cd plugins/sibyl && npm run build:trex   # build sibyl, base = /plugins/sibyl/
#   docker compose up -d --build             # build the image + run the stack
#   open http://localhost:8011/plugins/sibyl     # 8011 = HTTP (8010 = TLS)
#
# Unlike trex's own dev compose, this relies on the image's BAKED core/server,
# core/schema, deno.json and base plugins; sibyl is baked in by the Dockerfile
# rather than bind-mounted. Cryptographic keys are generated by trex-init into
# ./secrets on first boot.
name: trex-sibyl

volumes:
  pgdata:

services:
  # Generates TREX_ROOT_KEY + derived secrets into ./secrets on first boot.
  # Pinned to the same trex tag as the Dockerfile FROM so init and runtime
  # use one trex version.
  trex-init:
    image: ghcr.io/ohdsi/trexsql:sha-c5df9612216612296bbbdcd449543331ab41c761
    platform: linux/amd64
    # trex-init runs deno from /usr/src, which is root-owned in this build, so
    # deno can't create node_modules/.deno as the `node` user. Run as root.
    user: root
    entrypoint: /usr/local/bin/trex-init
    environment:
      TREX_SECRETS_DIR: /shared
    volumes:
      - ./secrets:/shared
    restart: 'no'

  postgres:
    image: postgres:16
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypass}
      POSTGRES_DB: testdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  trex:
    # Built from ./Dockerfile: the pinned trex image with the pre-built sibyl
    # plugin baked into /usr/src/plugins. Build sibyl first
    # (cd plugins/sibyl && npm run build:trex), then `docker compose up -d
    # --build`.
    build:
      context: .
      dockerfile: Dockerfile
      # trex publishes amd64-only images; build (and run) as amd64 so this works
      # on arm64 hosts too (via emulation).
      platforms:
        - linux/amd64
    platform: linux/amd64
    # WORKAROUND (older base): same root-owned /usr/src issue as trex-init — the
    # runtime worker needs to write node_modules under /usr/src. Run as root.
    # Remove when moving back to sha-8eaa659 or newer.
    user: root
    # Distinct host ports from trex's own docker-compose (8001/8000/5433) so
    # both stacks can run in parallel. Container ports are unchanged.
    ports:
      - 8011:8001 # HTTP (web UI, plugins, auth, graphql)
      - 8010:8000 # TLS
      - 5443:5432 # Postgres wire
    depends_on:
      trex-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    # Source the generated secrets at runtime (after trex-init has written
    # them) instead of via env_file. env_file is read when the container is
    # created — before first-boot init runs — which would leave TREX_ROOT_KEY
    # unset and require a second `up`. Sourcing at start makes one `up` work.
    entrypoint:
      - /bin/sh
      - -c
      - 'set -a; [ -f /shared/root.env ] && . /shared/root.env; [ -f /shared/derived.env ] && . /shared/derived.env; set +a; exec /usr/src/entrypoint.sh'
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-mypass}@postgres:5432/testdb
      BASE_PATH: /trex
      BETTER_AUTH_URL: http://localhost:8011/trex
      # Admin bootstrap, same convention as trex: the sign-up matching
      # ADMIN_EMAIL (or simply the first user) is promoted to admin. Override
      # with `ADMIN_EMAIL=you@example.com docker compose up -d`.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ohdsi.local}
      PLUGINS_PATH: /usr/src/plugins
      PLUGINS_DEV_PATH: /usr/src/plugins-dev
      SCHEMA_DIR: /usr/src/core/schema
      SWARM_CONFIG: >-
        {"cluster_id":"local","nodes":{"local":{"gossip_addr":"0.0.0.0:4200","extensions":[{"name":"trexas","config":{"host":"0.0.0.0","port":8001,"main_service_path":"/usr/src/core/server","event_worker_path":"/usr/src/core/event","tls_port":8000,"tls_cert_path":"/usr/src/server.crt","tls_key_path":"/usr/src/server.key"}},{"name":"pgwire","config":{"host":"0.0.0.0","port":5432}}]}}}
      SWARM_NODE: local
    volumes:
      # sibyl is baked into the image by Dockerfile — see the `build:` above.
      # Only the generated secrets are mounted at runtime.
      - ./secrets:/shared:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://localhost:8001/trex/api/ready'').then(r => { if (r.status !== 200) throw new Error(r.status) })"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
